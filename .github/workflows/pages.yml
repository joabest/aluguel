name: Sync AutoDeal and deploy to GitHub Pages

on:
  push:
    branches: ["test"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror AutoDeal source
        shell: bash
        run: |
          rm -rf /tmp/autodeal-mirror
          mkdir -p /tmp/autodeal-mirror
          set +e
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --domains tfautodeal.vercel.app \
            --directory-prefix=/tmp/autodeal-mirror \
            https://tfautodeal.vercel.app/
          WGET_STATUS=$?
          set -e
          echo "wget exit status: ${WGET_STATUS}"
          test -f /tmp/autodeal-mirror/tfautodeal.vercel.app/index.html

      - name: Replace repository site with mirrored source
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/autodeal-mirror/tfautodeal.vercel.app/ ./
          touch .nojekyll

      - name: Commit mirrored source back to test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync AutoDeal source [skip ci]"
            git push origin HEAD:test
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
